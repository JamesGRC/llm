* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 16px; }
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 0; }

h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 18px; margin: 0 0 8px; }
.sub { color: var(--text-2); margin: 2px 0 0; font-size: 14px; }
main.wrap { padding-top: 20px; padding-bottom: 60px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.center { text-align: center; }
[hidden] { display: none !important; }
button { font: inherit; cursor: pointer; }
/* phones: a tap acts at once (no double-tap zoom), and keyboard hints are hidden where there is no keyboard */
button, summary, a, input, label { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
@media (hover: none) and (pointer: coarse) { kbd, .kbd-only { display: none !important; } }
.btn { border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); padding: 10px 16px; font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.link { border: none; background: none; color: var(--accent); padding: 6px 0; font-weight: 600; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.msg { min-height: 22px; font-size: 14px; color: var(--text-2); margin-top: 8px; }
.msg.err { color: var(--bad); font-weight: 600; }
kbd { font: 12px var(--mono); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--text-2); background: var(--surface); }

/* opening a job */
input.job-input { font: 600 24px var(--mono); letter-spacing: 0.18em; text-transform: uppercase; width: 170px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); }
input.job-input::placeholder { color: var(--muted); letter-spacing: 0.1em; font-weight: 400; }

details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "▸"; transition: transform .15s ease; }
details.more[open] summary::before { transform: rotate(90deg); }
details.more summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
details.more > :not(summary) { font-size: 14px; color: var(--text-2); }

/* the job bar: which job, how far through, and stopping */
.jobbar { padding: 14px 20px; }

.jobbar .where { font-size: 13px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.05em; }
.progress { display: flex; gap: 4px; margin-top: 10px; }
.progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); }
.progress span.done { background: var(--accent); }
.progress span.now { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.progress.fine { gap: 2px; }

.qnum { font-size: 13px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.05em; }
.qtext { font-size: 20px; font-weight: 600; margin: 6px 0 18px; line-height: 1.4; }
.answers { display: grid; gap: 10px; }
.answer { text-align: left; border: 2px solid var(--border-strong); background: var(--surface); color: var(--text); border-radius: 12px; padding: 14px 16px; font-size: 17px; }
.answer:hover { border-color: var(--accent); }
.answer:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.answer kbd { margin-right: 10px; }

.answer.right { border-color: var(--good); background: var(--good-soft); }
.q-msg { min-height: 24px; margin-top: 12px; font-weight: 600; color: var(--bad); }
.q-msg.ok { color: var(--good); }

.review { font-size: 14px; color: var(--text-2); margin: 12px 0 0; padding-left: 22px; text-align: left; }
.review li { margin: 4px 0; }
.review .bad { color: var(--bad); font-weight: 600; }
.review .ok { color: var(--good); font-weight: 600; }

table.hist th, table.hist td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }

<script>
/* Jobs: each exercise's tasks dealt into five-minute jobs, the job codes that open them in the stage 1 app,
   and the result codes that carry a job's results to the stage 2 app. Shared by all four exercises:
   edit shared/jobs.js and run `node shared/sync.js`, which copies it into every app. No DOM code here,
   so it also runs under Node.

   Job code, three letters (e.g. KQM): which exercise and which job, with a check letter. The teacher hands
   these out (Job codes.html lists them all).
   Result code, 8, 12 or 16 characters in blocks of four (e.g. K7QM-2XPA): which job, how many of its tasks
   were done and the result of each one (e.g. how many wrong answers), as one number. A later code for the
   same job replaces the earlier one in the stage 2 app, so a job can be stopped early and finished later.

   Result codes are in Crockford base 32 (no I, L, O or U; those are read as 1, 1, 0 and V) and end in two check
   characters salted by exercise, so a mistyped code is almost always caught and a code from another
   exercise is recognised as such. The number is scrambled before writing so similar results give
   unrelated-looking codes. */
(function (root) {
  'use strict';

  const ALPHABET = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  const APPS = ['reaction', 'llm', 'retro', 'solubility'];
  const NAMES = { reaction: 'reaction optimiser', llm: 'language model', retro: 'retrosynthesis', solubility: 'solubility' };
  const MAX_JOBS = 64;                   // per exercise

  function hash(text) {
    let h = 2166136261;
    for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seedText) {
    let h = hash(seedText);
    return function () {
      h += 0x6D2B79F5; let t = h;
      t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(list, seedText) {
    const rand = rng(seedText), out = list.slice();
    for (let i = out.length - 1; i > 0; i--) {          // Fisher–Yates
      const j = Math.floor(rand() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  }

  /* Deals `ids` into `jobs` jobs of nearly equal size, the same on every device: shuffled with `seed`
     (or kept in the given order when seed is null), then dealt out in turn. */
  function deal(ids, jobs, seed) {
    const order = seed == null ? ids.slice() : shuffle(ids, seed);
    return Array.from({ length: jobs }, (_, j) => order.filter((_, i) => i % jobs === j));
  }

  const clean = (text) => String(text).toUpperCase().replace(/[\s-]/g, '')
    .replace(/O/g, '0').replace(/[IL]/g, '1').replace(/U/g, 'V');
  const check = (salt, data) => { const v = hash(salt + ':' + data) % 1024; return ALPHABET[v >> 5] + ALPHABET[v & 31]; };
  const blocks = (code) => code.match(/.{1,4}/g).join('-');
  const badChar = (text) => [...text].find((c) => !ALPHABET.includes(c));

  // ---------------------------------------------------------------- job codes
  /* Three letters: two for the job and a check letter, (a + 2b + 5) mod 23. As 23 is prime, any one wrong
     letter, and the first two swapped, always give a non-code. The 529 two-letter pairs are taken in a
     scrambled order (k × 200 + 61 mod 529), skipping any code that spells something unfortunate; the
     first 4 × 64 are the jobs (exercise by exercise). */
  const LETTERS = 'ABCDEFGHJKLMNPQRSTVWXYZ';           // no I, O or U (read as 1, 0 or V)
  const SKIP = new Set(('ASS BJS CNT DCK DMN DTF FAG FAP FCK FFS FKN FKY GAY GDM GSM JEW KKK KYS NAZ NGA NGR ' +
    'PMS PNS PSS PSY SEX SXY SHT STD TWT VAG WNK WTF XXX').split(' '));
  const JOB_CODES = (function () {
    const out = [];
    for (let k = 0; k < 529 && out.length < APPS.length * MAX_JOBS; k++) {
      const v = (k * 200 + 61) % 529, a = Math.floor(v / 23), b = v % 23;
      const code = LETTERS[a] + LETTERS[b] + LETTERS[(a + 2 * b + 5) % 23];
      if (!SKIP.has(code)) out.push(code);
    }
    return out;
  })();

  function jobCode(app, job) {
    return JOB_CODES[APPS.indexOf(app) * MAX_JOBS + job];
  }

  /* { app, job, code } for any exercise's job code, or { error }. */
  function readJobCode(text) {
    const c = String(text).toUpperCase().replace(/[\s-]/g, '');
    if (!c) return { error: 'Type your job code first.' };
    const bad = [...c].find((ch) => !LETTERS.includes(ch));
    if (bad) return { error: /[A-Z]/.test(bad) ? '“' + bad + '” is not used in job codes.' : 'Job codes are three letters, with no numbers.' };
    if (c.length !== 3) return { error: 'Job codes are three letters long.' };
    const n = JOB_CODES.indexOf(c);
    if (n < 0) return { error: c + ' is not a job code. Check each letter.' };
    return { app: APPS[Math.floor(n / MAX_JOBS)], job: n % MAX_JOBS, code: c };
  }

  // ---------------------------------------------------------------- result codes
  const MUL = 0x9E3779B97F4A7C15n, ADD = 0x6A09E667F3BCC909n;   // MUL is odd, so the scramble can be undone
  // multiply, fold the high half onto the low half, multiply again: every character depends on every other
  const scramble = (s, n) => { let v = (n * MUL + s.add) % s.mod; v ^= v >> s.half; return (v * MUL) % s.mod; };
  const unscramble = (s, v) => { v = (v * s.inv) % s.mod; v ^= v >> s.half; return (((v - s.add) * s.inv) % s.mod + s.mod) % s.mod; };

  /* An exercise's jobs and the possible results of each task. jobs: [[task id, ...], ...];
     radix: how many different results one task can have (they are 0 … radix-1). */
  function spec(app, jobs, radix) {
    if (!APPS.includes(app) || jobs.length > MAX_JOBS) throw new Error('Bad job spec for ' + app);
    const R = BigInt(radix), most = Math.max(...jobs.map((j) => j.length));
    const offset = [0n];                 // offset[k]: where the results of k done tasks start
    let p = 1n;
    for (let k = 0; k <= most; k++) { offset.push(offset[k] + p); p *= R; }
    const total = offset[most + 1] * BigInt(jobs.length);
    let length = Math.ceil(total.toString(2).length / 5);
    // whole blocks of four with the check characters, and never shorter than 8 characters
    while ((length + 2) % 4 || length + 2 < 8) length += 1;
    const mod = 1n << BigInt(5 * length);
    let inv = MUL;                                            // MUL^-1 mod 2^(5 length), by Newton's method
    for (let i = 0; i < 7; i++) inv = (inv * (2n - MUL * inv)) % mod;
    inv = ((inv % mod) + mod) % mod;
    const bits = BigInt(5 * length);
    return { app, name: NAMES[app], jobs, radix, R, offset, total, length, codeLength: length + 2, mod, inv,
      add: (ADD ^ BigInt(hash(app))) % mod, half: (bits + 1n) / 2n };
  }

  /* The code for job `job` (0-based) with `results` for its first results.length tasks. */
  function encode(s, job, results) {
    if (job < 0 || job >= s.jobs.length || results.length > s.jobs[job].length) throw new Error('Bad result for job ' + job);
    let mixed = 0n, p = 1n;
    for (const r of results) {
      if (!(r >= 0 && r < s.radix)) throw new Error('Bad task result ' + r);
      mixed += BigInt(r) * p; p *= s.R;
    }
    const n = BigInt(job) + BigInt(s.jobs.length) * (s.offset[results.length] + mixed);
    let v = scramble(s, n), data = '';
    for (let i = 0; i < s.length; i++) { data = ALPHABET[Number(v & 31n)] + data; v >>= 5n; }
    return blocks(data + check(s.app, data));
  }

  /* { job, tasks: [task id …], results: [result …], code } or { error }. `results` covers the tasks done. */
  function decode(s, text) {
    const c = clean(text);
    if (!c) return { error: 'Type a code first.' };
    if (badChar(c)) return { error: c + ': “' + badChar(c) + '” is not used in codes.' };
    const data = c.slice(0, -2), sum = c.slice(-2);
    if (!readJobCode(text).error) return { error: c + ' is a job code: enter it in the stage 1 app to open the job. The code for this app is the one shown when the job ends.' };
    if (c.length > 2 && check(s.app, data) !== sum) {
      const other = APPS.find((a) => a !== s.app && check(a, data) === sum);
      if (other) return { error: blocks(c) + ' is a code from the ' + NAMES[other] + ' exercise.' };
    }
    if (c.length !== s.codeLength) return { error: blocks(c) + ': codes for this app are ' + s.codeLength + ' characters long.' };
    if (check(s.app, data) !== sum) return { error: blocks(c) + ' has a typing mistake. Check each character.' };
    let v = 0n;
    for (const ch of data) v = v * 32n + BigInt(ALPHABET.indexOf(ch));
    const n = unscramble(s, v);
    const invalid = { error: blocks(c) + ' is not a result code. Check each character.' };
    if (n >= s.total) return invalid;
    const J = BigInt(s.jobs.length), job = Number(n % J), inner = n / J;
    let k = 0;
    while (s.offset[k + 1] <= inner) k += 1;
    if (k > s.jobs[job].length) return invalid;
    let mixed = inner - s.offset[k];
    const results = [];
    for (let i = 0; i < k; i++) { results.push(Number(mixed % s.R)); mixed /= s.R; }
    return { job, tasks: s.jobs[job], results, code: blocks(c) };
  }

  /* Splits typed or pasted text into codes: "K7QM-2XPA 4RT9-QQ1M", "K7QM2XPA,4RT9QQ1M" or one long run. */
  function split(s, text) {
    return String(text).split(/[\s,;]+/).map((t) => t.replace(/-/g, '')).filter(Boolean)
      .flatMap((t) => (t.length > s.codeLength && t.length % s.codeLength === 0 ? t.match(new RegExp('.{' + s.codeLength + '}', 'g')) : [t]));
  }

  /* Which exercise a result code is from, by its check characters ('reaction', 'llm', …), or null. */
  function appOf(text) {
    const c = clean(text);
    if (c.length < 8 || badChar(c)) return null;
    return APPS.find((a) => check(a, c.slice(0, -2)) === c.slice(-2)) || null;
  }

  const api = { APPS, NAMES, MAX_JOBS, hash, rng, shuffle, deal, jobCode, readJobCode, spec, encode, decode, split, appOf, blocks: (t) => blocks(clean(t)) };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Jobs = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* The language model exercise's jobs, shared by the training app and the chatbot app. Needs jobs.js.

   The 48 sources are shuffled once with a fixed seed and dealt into jobs of 3 (16 jobs). Each source asks two
   sentences, with 4 to 6 words to predict in each. Every 2 wrong words are one penalty, and each penalty costs
   the model a fifth of that source. The result of each source is its number of penalties: 0, 1, 2, 3, or 4
   (8 or more wrong words), which the chatbot passes to the engine as the source's loss. */
(function (root) {
  'use strict';

  const PER_JOB = 3;                     // sources per job
  const QUESTIONS = 2;                   // sentences asked per source
  const WRONG_PER_PENALTY = 2;
  const SEED = 'ssbd-llm-v3-jobs';
  const LEVELS = 5;                      // 0, 1, 2, 3, 4 penalties

  // matches Engine.keptFraction: each penalty costs a fifth of the source, down to a fifth
  const keptPercent = (penalties) => Math.max(20, 100 - 20 * penalties);
  const penalties = (wrong) => Math.min(LEVELS - 1, Math.floor(wrong / WRONG_PER_PENALTY));

  /* The jobs spec (see jobs.js) for these source ids. */
  const spec = (Jobs, sourceIds) =>
    Jobs.spec('llm', Jobs.deal(sourceIds, Math.max(1, Math.round(sourceIds.length / PER_JOB)), SEED), LEVELS);

  const api = { LEVELS, QUESTIONS, WRONG_PER_PENALTY, keptPercent, penalties, spec };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Codec = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

/* Your class codes server: paste the Worker's address (e.g. https://class-codes.yourname.workers.dev) between
   the quotes (see shared/class-server/README.md), then run  node shared/sync.js  to write it into every app.
   Left empty, the apps work without it: no "Send" or "Load sent codes" buttons, and the QR codes hold just

<script>
/* The class codes server (a Cloudflare Worker, shared/class-server/worker.js) collects the result codes from
   every device: the stage 1 apps and the code scanner send to it, and the stage 2 apps load from it.
   Built into every app by shared/sync.js, with class-config.js before it.
   Each row is { id, code, app, group, time }; a group is a short label the teacher gives out, e.g. 26a. */
(function () {
  'use strict';

  const BASE = String((window.CLASS_CONFIG || {}).serverUrl || '').trim().replace(/\/+$/, '');
  const GROUP_KEY = 'class-group';

  async function call(path, init) {
    if (!BASE) throw new Error('No class server is set up.');
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
    let res;
    try {
      res = await fetch(BASE + path, { ...init, signal: ctl.signal, cache: 'no-store' });
    } catch (e) {
      throw new Error(e && e.name === 'AbortError' ? 'The class server did not answer. Check the internet connection.'
        : 'Could not reach the class server. Check the internet connection.');
    } finally { clearTimeout(timer); }
    let value = null;
    try { value = await res.json(); } catch (e) { value = null; }
    if (!value) throw new Error(`The class server gave an unexpected answer (${res.status}).`);
    if (!value.ok) throw new Error(value.error || 'The class server refused the request.');
    return value;
  }

  const cleanGroup = (g) => String(g || '').trim().toLowerCase().replace(/\s+/g, '').slice(0, 20);

  window.ClassServer = {
    enabled: !!BASE,
    get group() { try { return localStorage.getItem(GROUP_KEY) || ''; } catch (e) { return ''; } },
    set group(g) { try { localStorage.setItem(GROUP_KEY, cleanGroup(g)); } catch (e) { /* storage unavailable */ } },
    cleanGroup,

    /* What a QR code holds: a link that adds the code when opened (e.g. scanned with a phone's own camera),
       or with no server set up, just the code. */
    link(code, app, group) {
      if (!BASE) return code;
      return BASE + '/add?' + new URLSearchParams({ c: code.replace(/-/g, ''), a: app, g: cleanGroup(group) || '-' }).toString();
    },
    /* Adds one code. Resolves { ok, added } (added false: the group had it already). Sent as plain text, so

<script>
/* The page every stage 1 app is built on: open a job with its job code, work through the job's tasks one
   at a time, and get the result code for the stage 2 app. The app itself only draws one task at a time.
   Edit shared/job-page.js and run `node shared/sync.js`. Needs jobs.js.

   JobPage.run({
     spec,                        // Jobs.spec(...) of this exercise
     stage2,                      // where the result code goes, e.g. "the chatbot"
     task: ["source", "sources"], // what one task is called
     renderTask(ctx),             // draw task ctx.id into ctx.el; call ctx.done(result) when it is finished
     review(id, result),          // optional: HTML for one line of the end-of-job review
     summary(results, ids),       // optional: one line of HTML above the review
     back: false,                 // true: the player may undo the previous task (ctx.back)
   })
   ctx: { el, id, index, count, partial, save(partial), done(result), back() or null }. `partial` is the app's
   own saved state for an unfinished task (e.g. wrong attempts so far), kept across reloads. */
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
  };

  // theme toggle, shared by all the apps (the OS setting applies until the player chooses)
  const savedTheme = store.get("job-theme", null);
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  function themeButton() {
    const b = $("theme");
    if (b) b.onclick = () => {
      const root = document.documentElement;
      const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark"; store.set("job-theme", root.dataset.theme);
    };
  }

  /* Copies text. The Clipboard API is blocked in some places the apps are opened (Google Drive's preview,
     some file:// pages), so fall back to the older execCommand copy from a hidden text box. */
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* try the fallback */ }
    const t = document.createElement("textarea");
    t.value = text; t.readOnly = true;
    t.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";   // 16px: no zoom on iOS
    document.body.appendChild(t);
    t.select(); t.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    t.remove();
    return ok;
  }

  function run(cfg) {
    const S = cfg.spec, KEY = `job-${S.app}-v1`;
    const [one, many] = cfg.task;
    // open: the job on screen; jobs: job -> { results, partial }; history: [{ job, code, done, at }]
    const state = Object.assign({ open: null, jobs: {}, history: [] }, store.get(KEY, {}));
    const save = () => store.set(KEY, state);
    const jobState = (j) => (state.jobs[j] = state.jobs[j] || { results: [], partial: null });
    const finished = (j) => jobState(j).results.length >= S.jobs[j].length;
    const label = (j) => `Job ${j + 1}`;

    themeButton();
    $("app").innerHTML = `
      <section id="s-open" class="card" hidden>
        <h2>Open your job</h2>
        <p class="muted small" style="margin-top:0">Type the three-letter job code you were given.</p>
        <form class="row" id="job-form" autocomplete="off">
          <input class="job-input" id="job-code" maxlength="4" placeholder="KQM" aria-label="Job code" spellcheck="false" autocapitalize="characters">
          <button class="btn primary" type="submit">Open job</button>
        </form>
        <div class="msg" id="job-msg" role="status"></div>
        <div id="resume"></div>
      </section>
      <section id="s-job" hidden>
        <div class="card jobbar">
          <div class="row"><span class="where" id="job-where"></span>
            <button class="btn link" id="job-stop" type="button">End job and get code</button></div>
          <div class="progress" id="job-progress"></div>
        </div>
        <div id="task"></div>
      </section>
      <section id="s-code" class="card center" hidden>
        <h2 id="code-title"></h2>
        <div class="send" id="send-box" hidden>
          <label for="group">Send your result to your teacher, with the group code you were given</label>
          <div class="row"><input class="group-input" id="group" maxlength="20" placeholder="group code" autocomplete="off" spellcheck="false" autocapitalize="none">
            <button class="btn primary" id="send" type="button">Send to teacher</button></div>
          <div class="msg" id="send-msg" role="status"></div>
        </div>
        <div class="row" style="justify-content:center;margin-top:10px">
          <button class="btn" id="code-back" type="button" hidden></button>
          <button class="btn" id="another" type="button">Open another job</button>
        </div>
        <details class="more share-more" id="share-more">
          <summary>Share another way</summary>
          <div class="code" id="code" aria-live="polite"></div>
          <p class="muted small" style="margin:4px 0 10px">Your result code: enter it in ${esc(cfg.stage2)}, with the rest of your group’s codes.</p>
          <div class="row" style="justify-content:center"><button class="btn" id="copy" type="button">Copy code</button></div>
          <div class="msg" id="copy-msg" role="status"></div>
          <figure class="qr"><div id="code-qr"></div><figcaption class="muted small">Or let your teacher scan it</figcaption></figure>
        </details>
        <p class="small" id="code-summary" style="margin:14px 0 0;text-align:left"></p>
        <ol class="review" id="review"></ol>
      </section>
      <section id="s-history" class="card" hidden>
        <h2 style="font-size:16px">Codes made on this device</h2>
        <table class="hist" id="hist-table"><thead><tr><th>Job</th><th>Code</th><th>Done</th><th>Time</th><th></th></tr></thead><tbody id="hist"></tbody></table>
        <div class="row" style="margin-top:12px"><button class="btn" id="clear-device" type="button">Clear all jobs on this device</button></div>
      </section>`;

    const screens = ["s-open", "s-job", "s-code"];
    function show(id) {
      screens.forEach((s) => { $(s).hidden = s !== id; });
      $("s-history").hidden = id === "s-job" || !anything();
      $("hist-table").hidden = !state.history.length;
      window.scrollTo(0, 0);
    }

    // anything saved on this device for this exercise: codes made, or jobs started
    const anything = () => state.history.length > 0 || Object.values(state.jobs).some((js) => js.results.length || js.partial);
    // clearing the device, e.g. before the next class: every job, its progress and its codes
    $("clear-device").onclick = () => {
      if (!confirm(`Clear every job and code saved on this device for this exercise? Codes already sent or entered elsewhere are not affected, and any job can be done again.`)) return;
      state.open = null; state.jobs = {}; state.history = [];
      save();
      showOpen("All jobs on this device have been cleared.");
    };

    // ---------------------------------------------------------------- opening a job
    function showOpen(msg, isError) {
      state.open = null; save();
      $("job-msg").textContent = msg || "";
      $("job-msg").classList.toggle("err", !!isError);
      const going = Object.keys(state.jobs).map(Number).filter((j) => j < S.jobs.length && jobState(j).results.length && !finished(j));
      $("resume").innerHTML = going.length ? `<p class="small muted" style="margin:12px 0 6px">Or carry on with an unfinished job on this device:</p><div class="row">` +
        going.map((j) => `<button class="btn" type="button" data-job="${j}">${label(j)} · ${jobState(j).results.length} of ${S.jobs[j].length} done</button>`).join("") + "</div>" : "";
      renderHistory();
      show("s-open");
      $("job-code").value = "";
      $("job-code").focus();
    }
    function tryCode(text) {
      const got = Jobs.readJobCode(text);
      if (got.error) return showOpen(got.error, true);
      if (got.app !== S.app) return showOpen(`${got.code} is a job code for the ${Jobs.NAMES[got.app]} exercise. Open that exercise’s app to do it.`, true);
      if (got.job >= S.jobs.length) return showOpen(`${got.code} is not one of this exercise’s jobs.`, true);
      openJob(got.job);
    }
    $("job-form").onsubmit = (e) => { e.preventDefault(); tryCode($("job-code").value); };
    $("resume").onclick = (e) => { const b = e.target.closest("button[data-job]"); if (b) openJob(+b.dataset.job); };

    function openJob(j) {
      state.open = j; save();
      if (finished(j)) return showCode(j);
      show("s-job");
      nextTask();
    }

    // ---------------------------------------------------------------- doing the tasks
    function nextTask() {
      const j = state.open, js = jobState(j), ids = S.jobs[j], i = js.results.length;
      if (i >= ids.length) return showCode(j);
      $("job-where").textContent = `${label(j)} · ${one} ${i + 1} of ${ids.length}`;
      $("job-progress").className = "progress" + (ids.length > 30 ? " fine" : "");
      $("job-progress").innerHTML = ids.map((_, k) => `<span class="${k < i ? "done" : k === i ? "now" : ""}"></span>`).join("");
      let live = true;            // a task can only finish once
      cfg.renderTask({
        el: $("task"), id: ids[i], index: i, count: ids.length, job: j, partial: js.partial,
        save(p) { if (live) { js.partial = p; save(); } },
        done(result) {
          if (!live) return;
          live = false; js.results.push(result); js.partial = null; save();
          nextTask();
        },
        back: cfg.back && i > 0 ? () => { if (!live) return; live = false; js.results.pop(); js.partial = null; save(); nextTask(); } : null,
      });
    }
    $("job-stop").onclick = () => showCode(state.open);

    // ---------------------------------------------------------------- the result code
    function showCode(j) {
      const js = jobState(j), ids = S.jobs[j], n = js.results.length;
      const code = Jobs.encode(S, j, js.results);
      const prev = state.history.find((h) => h.job === j);
      if (!prev || prev.code !== code) {
        state.history = [{ job: j, code, done: n, of: ids.length, at: new Date().toISOString() }, ...state.history.filter((h) => h.job !== j)].slice(0, 30);
      }
      state.open = n < ids.length ? j : null; save();
      $("code-title").textContent = n < ids.length ? `${label(j)}: ${n} of ${ids.length} ${many} so far` : `${label(j)} done`;
      $("code").innerHTML = code.split("-").map((b) => `<span>${b}</span>`).join("");
      $("code").setAttribute("aria-label", "Code " + [...code.replace(/-/g, "")].join(" "));
      $("copy-msg").textContent = "";
      $("copy").onclick = async () => {
        $("copy-msg").textContent = (await copyText(code)) ? `Copied ${code}.` : `Copy is not available here: write down ${code}.`;
      };
      showShare(code);
      const left = ids.length - n;
      $("code-back").hidden = !left;
      $("code-back").textContent = `Back to the job (${left} ${left === 1 ? one : many} left)`;
      $("code-back").onclick = () => openJob(j);
      const sum = [`${n} of ${ids.length} ${many} done.${left ? ` Finish the rest to get a new code that replaces this one.` : ""}`];
      if (cfg.summary && n) sum.push(cfg.summary(js.results, ids.slice(0, n)));
      $("code-summary").innerHTML = sum.join(" ");
      $("review").innerHTML = cfg.review ? js.results.map((r, k) => `<li>${cfg.review(ids[k], r)}</li>`).join("") : "";
      renderHistory();
      show("s-code");
    }
    $("another").onclick = () => showOpen();

    /* A code made earlier on this device, from "Codes made on this device": shown only to send or share it.
       Nothing about the job changes, and there is no way back into the job from here. */
    function showSaved(h) {
      const js = jobState(h.job), ids = S.jobs[h.job], n = Math.min(js.results.length, h.done);
      $("code-title").textContent = `${label(h.job)}: code made at ${new Date(h.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} (${h.done} of ${h.of} ${many})`;
      $("code").innerHTML = h.code.split("-").map((b) => `<span>${b}</span>`).join("");
      $("code").setAttribute("aria-label", "Code " + [...h.code.replace(/-/g, "")].join(" "));
      $("copy-msg").textContent = "";
      $("copy").onclick = async () => {
        $("copy-msg").textContent = (await copyText(h.code)) ? `Copied ${h.code}.` : `Copy is not available here: write down ${h.code}.`;
      };
      showShare(h.code);
      $("code-back").hidden = true;
      $("code-summary").innerHTML = "";
      $("review").innerHTML = cfg.review ? js.results.slice(0, n).map((r, k) => `<li>${cfg.review(ids[k], r)}</li>`).join("") : "";
      renderHistory();
      show("s-code");
    }
    $("hist").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-code]");
      const h = b && state.history.find((x) => x.code === b.dataset.code);
      if (h) showSaved(h);
    });

    // the QR code (a link that sends the code to the class server, or just the code) and the Send button
    const Server = window.ClassServer;
    function drawQR(text) {
      if (typeof qrcode !== "function") { $("code-qr").closest(".qr").hidden = true; return; }
      const q = qrcode(0, "M");
      q.addData(text);
      q.make();
      $("code-qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 3, scalable: true, alt: "QR code of your result code" });
    }
    function showShare(code) {
      const server = !!(Server && Server.enabled);
      $("send-box").hidden = !server;
      $("share-more").open = !server;        // with nothing to send to, the code is the way to share
      drawQR(server ? Server.link(code, S.app, '') : code);
      if (!server) return;
      const sentTo = () => (state.history.find((h) => h.code === code) || {}).sent;
      $("group").value = "";                 // never pre-filled: on a shared computer it would be another group's
      $("send-msg").textContent = sentTo() ? `Sent to group ${sentTo()}.` : "";
      $("send-msg").classList.remove("err");
      $("group").oninput = () => { drawQR(Server.link(code, S.app, $("group").value)); };
      $("send").onclick = async () => {
        const group = Server.cleanGroup($("group").value);
        if (!group) { $("send-msg").textContent = "Type the group code your teacher gave you first."; $("send-msg").classList.add("err"); $("group").focus(); return; }
        Server.group = group;
        $("send").disabled = true;
        $("send-msg").classList.remove("err");
        $("send-msg").textContent = "Sending…";
        try {
          const r = await Server.send(code, S.app, group, "app");
          const h = state.history.find((x) => x.code === code);
          if (h) { h.sent = group; save(); renderHistory(); }
          $("send-msg").textContent = r.added ? `Sent to group ${group}.` : `Group ${group} has this code already.`;
        } catch (e) {
          $("send-msg").textContent = `${e.message} Your teacher can scan the QR code instead.`;
          $("send-msg").classList.add("err");
        }
        $("send").disabled = false;
      };
    }

    function renderHistory() {
      $("hist").innerHTML = state.history.filter((h) => h.job < S.jobs.length).map((h) => `<tr><td>${h.job + 1}</td><td class="code-cell">${esc(h.code)}</td>
        <td>${h.done} of ${h.of}</td><td class="muted">${new Date(h.at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</td>
        <td>${h.sent ? `<span class="muted small">sent (${esc(h.sent)})</span> ` : ""}<button class="btn link" type="button" data-code="${esc(h.code)}">${h.sent ? "Again" : "Send"}</button></td></tr>`).join("");
    }

    // start: a ?job=KQM link opens that job, otherwise carry on where this device left off
    const linked = new URLSearchParams(location.search).get("job");
    if (linked) tryCode(linked);
    else if (state.open !== null && state.open < S.jobs.length) openJob(state.open);
    else showOpen();
  }

  window.JobPage = { run, esc, store };
})();
</script>
<script>
/* Training app: one job of sources. For each source two sentences appear a word at a time and the player
   predicts the missing words. Every 2 wrong words across the two sentences are one penalty; the number of
   penalties is the source's result. */
(function () {
  'use strict';

  const CORPUS = window.CORPUS;
  const { esc } = window.JobPage;
  const REVEAL_MS = 110;      // pause between words appearing in the sentence

  const ids = CORPUS.sources.map((s) => s.id);
  const byId = new Map(CORPUS.sources.map((s) => [s.id, s]));
  const SPEC = Codec.spec(Jobs, ids);
  function byline(src) {
    const names = src.authors.split(';').map((a) => a.trim()).filter(Boolean);
    return [names.length > 3 ? names[0] + ' et al.' : names.join('; '), src.year].filter(Boolean).join(', ');
  }
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
  const penaltyText = (p) => (p ? `<span class="bad">${plural(p, 'penalty', 'penalties')}</span>, ${Codec.keptPercent(p)}% read` : '<span class="ok">no penalty</span>, 100% read');

  let timer = null, onKey = null;
  document.addEventListener('keydown', (e) => { if (onKey && e.target.tagName !== 'INPUT' && !e.metaKey && !e.ctrlKey) onKey(e); });

  /* ctx.partial, kept across reloads: { items: [two training sentence indices], q: sentences finished,
     wrong: wrong words so far, mistakes }. So reloading neither undoes wrong words nor swaps the sentences. */
  function renderTask(ctx) {
    clearTimeout(timer);
    const src = byId.get(ctx.id);
    let st = ctx.partial;
    if (!st) {
      const order = src.train.map((_, i) => i).sort(() => Math.random() - 0.5);
      st = { items: order.slice(0, Codec.QUESTIONS), q: 0, wrong: 0, mistakes: [] };
      ctx.save(st);
    }
    const last = ctx.index === ctx.count - 1;

    ctx.el.innerHTML = `<div class="card">
      <div class="qnum">Source ${ctx.index + 1} of ${ctx.count} · sentence <span id="qno"></span> of ${st.items.length}</div>
      <h2 style="margin:4px 0 2px">${esc(src.title)}</h2>
      <p class="muted small" style="margin:0 0 16px">${esc(byline(src))}</p>
      <p class="sentence" id="sentence"></p>
      <div class="answers two" id="options" role="group" aria-label="Next word"></div>
      <div id="outcome"></div>
      <details class="more">
        <summary>What is happening?</summary>
        <p>Why: you are doing what a large language model does when it is first trained. It reads huge amounts of text and keeps guessing the next word, then checks the real one. Nobody labels anything, because the text itself holds the answers: this is self-supervised learning (often called unsupervised). Your guesses decide how much of each source the class’s chatbot learns from.</p>
        <p>The model learns by predicting the next word. These two sentences stand for the whole source: the fewer wrong words, the more of it the chatbot reads. Every 2 wrong words are a penalty, and each penalty costs the model a fifth of the source, down to a fifth.</p>
        <p class="kbd-only" style="margin-bottom:0">Tip: press 1 to 4 to choose a word.</p>
      </details>
    </div>`;
    const sentence = document.getElementById('sentence'), options = document.getElementById('options'), outcome = document.getElementById('outcome');
    const word = (text, cls) => { const s = document.createElement('span'); s.className = 'word' + (cls ? ' ' + cls : ''); s.textContent = text; return s; };

    function ask() {
      const item = src.train[st.items[st.q]];
      const tokens = item.s.split(' ');
      const points = new Map(item.c.map(([i, opts]) => [i, { correct: opts[0], options: opts.slice().sort(() => Math.random() - 0.5) }]));
      let pos = 0, waiting = false;
      document.getElementById('qno').textContent = st.q + 1;
      sentence.textContent = ''; outcome.innerHTML = ''; options.hidden = false;

      function advance() {
        if (pos >= tokens.length) return finished();
        if (points.has(pos)) {
          waiting = true;
          const blank = document.createElement('span'); blank.className = 'blank'; blank.id = 'blank';
          sentence.append(blank);
          options.innerHTML = points.get(pos).options.map((o, i) => `<button class="answer" type="button" data-i="${i}"><kbd>${i + 1}</kbd>${esc(o)}</button>`).join('');
          return;
        }
        sentence.append(word(tokens[pos]), ' ');
        pos += 1;
        timer = setTimeout(advance, REVEAL_MS);
      }
      function choose(i) {
        if (!waiting) return;
        const point = points.get(pos), option = point.options[i];
        if (option === undefined) return;
        waiting = false;
        const ok = option === point.correct;
        const blank = document.getElementById('blank');
        if (ok) blank.replaceWith(word(tokens[pos], 'ok'), ' ');
        else {
          st.wrong += 1; st.mistakes.push([point.correct, option]); ctx.save(st);
          blank.replaceWith(word(option, 'struck'), ' ', word(tokens[pos], 'bad'), ' ');
        }
        options.innerHTML = '';
        pos += 1;
        timer = setTimeout(advance, ok ? REVEAL_MS : 700);
      }
      options.onclick = (e) => { const b = e.target.closest('button[data-i]'); if (b) choose(+b.dataset.i); };
      onKey = (e) => { if (/^[1-4]$/.test(e.key)) choose(+e.key - 1); };
      advance();
    }

    function finished() {
      st.q += 1; ctx.save(st);
      showResult();
    }
    function showResult() {
      onKey = null;
      options.hidden = true;
      const more = st.q < st.items.length;
      const p = Codec.penalties(st.wrong);
      outcome.innerHTML = `
        <div class="q-msg${st.wrong ? '' : ' ok'}">${more
          ? (st.wrong ? `${plural(st.wrong, 'wrong word', 'wrong words')} so far` : 'No wrong words so far')
          : (p ? `${plural(st.wrong, 'wrong word', 'wrong words')}, ${plural(p, 'penalty', 'penalties')}: the model read ${Codec.keptPercent(p)}% of this source`
               : st.wrong ? '1 wrong word, no penalty: the model read the whole source' : 'Exact match: the model read the whole source')}</div>
        ${!more && st.mistakes.length ? `<ul class="small muted" style="margin:6px 0 0;padding-left:20px">${st.mistakes.map(([good, bad]) => `<li>“${esc(bad)}” where the source says “${esc(good)}”</li>`).join('')}</ul>` : ''}
        <div class="row" style="margin-top:16px"><button class="btn primary" type="button" id="next">${more ? 'Next sentence' : last ? 'Finish the job' : 'Next source'}</button></div>`;
      const next = document.getElementById('next');
      next.onclick = () => (more ? ask() : ctx.done(p));
      next.focus();
    }

    // carry on where a reload left off: a finished sentence is not asked again, and wrong words stay counted
    if (st.q >= st.items.length) { document.getElementById('qno').textContent = st.items.length; showResult(); } else ask();
  }

  JobPage.run({
    spec: SPEC,
    stage2: 'the chatbot (Ask the language model)',
    task: ['source', 'sources'],
    renderTask,
    review: (id, p) => `${esc(byId.get(id).title)}: ${penaltyText(p)}`,
    summary: (results) => `${results.filter((p) => !p).length} read in full.`,
  });
  // leaving a task (ending the job early) stops the sentence
  document.getElementById('job-stop').addEventListener('click', () => { clearTimeout(timer); onKey = null; });
})();
</script>

    var box = document.createElement('div');
    box.className = 'gr-brand';
    box.appendChild(a);
    // in the header's row, at the right end, with the theme button (if there is one) after it; or at the top right
    var row = header.querySelector('.head-row') || header;
    var theme = row.querySelector('#theme');
    if (getComputedStyle(row).display.indexOf('flex') >= 0) {
      row.classList.add('gr-flex');
      row.appendChild(box);
      if (theme && theme.parentNode === row) { box.appendChild(theme); theme.style.marginLeft = '10px'; }
    } else {
      box.classList.add('gr-float');
      box.style.cssText = 'float:right;margin:0 0 8px 16px';
      row.insertBefore(box, row.firstChild);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', place); else place();
})();
</script>
</body>
</html>
